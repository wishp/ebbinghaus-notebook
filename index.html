function translateEnglish(text){const key=text.toLowerCase().replace(/[^a-z' ]/g,' ').replace(/\s+/g,' ').trim();if(englishPhrases[key])return{value:englishPhrases[key],unknown:false};let unknown=false;const value=text.replace(/[A-Za-z]+(?:'[A-Za-z]+)?/g,word=>{const lower=word.toLowerCase();if(Object.hasOwn(englishWords,lower))return englishWords[lower];unknown=true;return word});return{value,unknown}}
const pinyinPhraseKeys=Object.keys(pinyinWords).sort((a,b)=>b.length-a.length);
function translatePinyin(text){let compact=normalizePinyin(text);for(const key of pinyinPhraseKeys)if(compact===key)return{value:pinyinWords[key],unknown:false};const syllables=text.trim().split(/[\s-]+/).filter(Boolean);let value='',unknown=false;for(let i=0;i<syllables.length;){let matched='';for(let n=Math.min(3,syllables.length-i);n>0;n--){const key=normalizePinyin(syllables.slice(i,i+n).join(''));if(pinyinWords[key]){matched=pinyinWords[key];i+=n;break}}if(matched){value+=matched;continue}const key=normalizePinyin(syllables[i++]);if(pinyinWords[key])value+=pinyinWords[key];else{value+=syllables[i-1];unknown=true}}return{value,unknown}}

function renderToday(){const d=due(), handled=Object.keys(marked).length;let groups=cats.map(c=>[c,d.filter(x=>x.category===c)]).filter(x=>x[1].length);document.getElementById('today').innerHTML=`<button class="install" id="installBtn">添加到主屏幕</button><h1 class="title">今日复习</h1><div class="progress-meta"><span>今日${d.length}条 · 已标记${handled}条</span><span>约${Math.max(1,Math.ceil((d.length-handled)/3))}分钟</span></div><div class="progress"><i style="width:${d.length?handled/d.length*100:0}%"></i></div><div class="tabs review-shortcuts">${cats.map((c,i)=>`<button type="button" class="${groups[0]&&groups[0][0]===c?'active':''}" data-locate="${i}">${c.replace('-','')} (${d.filter(x=>x.category===c).length})</button>`).join('')}</div>${groups.length?``+groups.map(([c,rows])=>`<div class="group review-group" id="review-group-${cats.indexOf(c)}"><div class="group-head"><span>${c.replace('英语-','')} · ${rows.length}条</span><small>今日到期</small></div>${rows.map(rowHtml).join('')}<button class="finish" data-finish="${c}">完成本组</button></div>`).join(''):`<div class="empty"><strong>${state.items.length?'今天没有到期的复习':'还没有错题'}</strong><span>${state.items.length?'最近的复习会按计划出现':'去快速录入记第一批吧'}</span></div>`}`;document.querySelectorAll('[data-locate]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-locate]').forEach(x=>x.classList.toggle('active',x===b));const group=document.getElementById('review-group-'+b.dataset.locate);if(group)group.scrollIntoView({behavior:'smooth',block:'start'});else toast('这个分类今天没有待复习内容')});document.querySelectorAll('[data-mark]').forEach(b=>b.onclick=()=>mark(+b.dataset.mark,b.dataset.result));document.querySelectorAll('[data-finish]').forEach(b=>b.onclick=()=>finish(b.dataset.finish));}
function rowHtml(x){const m=marked[x.id],prompt=x.prompt||x.text;return `<div class="row ${m==='wrong'?'wrong-mark':''}"><div class="row-main">${/[A-Za-z]/.test(prompt)?`<button class="sound" data-speak="${esc(prompt)}">🔊</button>`:''}<span>${esc(prompt)}</span></div><div class="row-meta">${x.created_at.slice(5).replace('-','.')}录入 · 第${x.stage+1}/6次 · 错${x.wrong_count+(m==='wrong'?1:0)}次 ${x.wrong_count+(m==='wrong'?1:0)>=3?'<b style="color:#e5484d">· 顽固</b>':''}</div><div class="row-actions"><button class="btn ${m==='mastered'?'green selected':''}" aria-pressed="${m==='mastered'}" data-mark="${x.id}" data-result="mastered" >掌握</button><button class="btn ${m==='wrong'?'red selected':''}" data-mark="${x.id}" data-result="wrong">${m==='wrong'?'已标错':'错了'}</button></div></div>`}
function mark(id,result){if(marked[id]===result)delete marked[id];else marked[id]=result;render()}
function finish(cat){commitGroup(due().filter(x=>x.category===cat))}
function commitGroup(rows){rows.filter(x=>x.last_review_at!==today()).forEach(x=>{const result=marked[x.id]||'reviewed';if(result==='wrong')x.wrong_count++;if(result==='mastered'){x.status='已掌握';x.mastered_at=today()}else{const stage=Math.min(x.stage||0,5);x.next_review_at=addDays(today(),intervals[stage]);x.stage=Math.min(stage+1,5)}x.last_review_at=today();state.logs.push({item_id:x.id,date:today(),result});delete marked[x.id]});save();closeSheet();render()}
function convertPair(value){if(!value.trim())return {value:'',unknown:false};if(captureCat.startsWith('语文'))return /[\u3400-\u9fff]/.test(value)?toPinyin(value):translatePinyin(value);if(/[a-z]/i.test(value))return translateEnglish(value);const match=Object.entries({...englishWords,...englishPhrases}).find(([k,v])=>v===value.trim()&&v);return match?{value:match[0],unknown:false}:{value:'',unknown:true}}

function reminderValue(hour,minute){hour=Number(hour);minute=Number(minute);if(!Number.isInteger(hour)||!Number.isInteger(minute)||hour<8||hour>24||minute<0||minute>59||(hour===24&&minute!==0))return null;return String(hour).padStart(2,'0')+':'+String(minute).padStart(2,'0')}

function editLeak(){openSheet(`<h3>漏复习处理</h3><p class="setting-help">可多选，点击保存后生效。</p><div class="leak-options">${['顺延一天','从头开始复习'].map((x,i)=>`<label><input type="checkbox" id="leakOption${i}" value="${x}" ${state.settings.leakOptions.includes(x)?'checked':''}><span>${x}</span></label>`).join('')}</div><p class="setting-help">同时选择：轮次重置为第1轮，安排到明天。仅选择从头开始：重置轮次并保留在今日。未选择：保留原计划。适用于逾期且未完成的复习任务；完成本组即代表所有词条已复习。</p><button id="saveLeak">保存设置</button><button id="cancelSetting">取消</button>`);document.getElementById('saveLeak').onclick=()=>{state.settings.leakOptions=[0,1].map(i=>document.getElementById('leakOption'+i)).filter(x=>x.checked).map(x=>x.value);state.settings.leak=state.settings.leakOptions.join('、');save();closeSheet();renderProfile();toast('漏复习设置已保存')};document.getElementById('cancelSetting').onclick=closeSheet;}
function subPage(title,body){const page=document.getElementById(current);page.innerHTML=`<button type="button" class="back" data-back aria-label="返回">‹</button><h1 class="title" style="display:inline-block;margin-left:4px">${title}</h1>${body}`;const back=page.querySelector('[data-back]');back.addEventListener('click',()=>{current='profile';render()})}
function renderDetail(){const filtered=state.items.filter(x=>(!detailCategory||x.category===detailCategory)&&(!detailStatus||(detailStatus==='顽固'?x.wrong_count>=3:x.status===detailStatus))),dates=[...new Set(filtered.map(x=>x.created_at))].sort().reverse();const grouped=dates.map(date=>{const dayItems=filtered.filter(x=>x.created_at===date),dayCats=cats.filter(c=>dayItems.some(x=>x.category===c));const panels=dayCats.map((c,index)=>{const rows=dayItems.filter(x=>x.category===c);return `<div class="day-panel ${index===0?'active':''}" data-day-panel="${date}" data-category="${c}"><div class="detail-list">${rows.map(x=>`<article class="detail-entry"><div class="detail-text ${x.status==='已掌握'?'green':x.wrong_count>=3?'red':''}">${esc(x.text)}${x.legacy_type?` <small class="legacy-type">${x.legacy_type}</small>`:''}</div>${x.prompt?`<div class="detail-prompt">提示：${esc(x.prompt)}</div>`:''}<div class="detail-meta"><span>第 ${Math.min(x.stage+1,6)}/6 轮</span></div></article>`).join('')}</div></div>`}).join('');const tabs=dayCats.length>1?`<div class="day-tabs">${dayCats.map((c,index)=>`<button type="button" class="${index===0?'active':''}" data-day-tab="${date}" data-category="${c}">${c.replace('英语-','英语')} (${dayItems.filter(x=>x.category===c).length})</button>`).join('')}</div>`:'';return `<section><div class="date-group-title">${date.replaceAll('-','.')}</div>${tabs}${panels}</section>`}).join('');const filters=[['','全部'],['复习中','复习中'],['顽固','顽固'],['已掌握','已掌握']].map(([value,label])=>{const count=state.items.filter(x=>(!detailCategory||x.category===detailCategory)&&(!value||(value==='顽固'?x.wrong_count>=3:x.status===value))).length;return `<button class="${detailStatus===value?'active':''}" data-detail-status="${value}">${label}(${count})</button>`}).join('');const catFilters=`<div class="day-tabs detail-category-tabs"><button class="${!detailCategory?'active':''}" data-detail-cat="">全部分类</button>${cats.map(c=>`<button class="${detailCategory===c?'active':''}" data-detail-cat="${c}">${c}</button>`).join('')}</div>`;subPage('录入信息详情',`${catFilters}<div class="filter">${filters}</div><p class="subtle">按录入时间展示 · 蓝色为复习中，红色为顽固</p>${grouped||'<div class="empty">没有符合条件的录入信息</div>'}`);document.querySelectorAll('#detail [data-detail-cat]').forEach(b=>b.onclick=()=>{detailCategory=b.dataset.detailCat;render()});document.querySelectorAll('#detail [data-detail-status]').forEach(b=>b.onclick=()=>{detailStatus=b.dataset.detailStatus;render()});document.querySelectorAll('#detail [data-day-tab]').forEach(button=>button.addEventListener('click',()=>{const date=button.dataset.dayTab,category=button.dataset.category;document.querySelectorAll(`#detail [data-day-tab="${date}"]`).forEach(tab=>tab.classList.toggle('active',tab===button));document.querySelectorAll(`#detail [data-day-panel="${date}"]`).forEach(panel=>panel.classList.toggle('active',panel.dataset.category===category))}))}
function renderHistory(){const dates=[...new Set(state.logs.map(x=>x.date))].sort().reverse().slice(0,10);const body=dates.length?dates.map(d=>{const logs=state.logs.filter(x=>x.date===d);return `<div class="history-item"><div class="history-head"><span>${d.slice(5).replace('-','月')+'日'}</span><small>${logs.length}条 · 错${logs.filter(x=>x.result==='wrong').length} · 掌握${logs.filter(x=>x.result==='mastered').length}</small></div><div class="history-body">${logs.map(l=>{const x=state.items.find(i=>i.id===l.item_id);return x?`<span class="token ${l.result==='wrong'?'red':l.result==='mastered'?'green':''}">${esc(x.text)}</span>`:''}).join(' ｜ ')}</div></div>`}).join(''):`<div class="empty">还没有复习记录</div>`;subPage('复习历史记录',`<p class="subtle">红色代表错了，绿色代表掌握</p>${body}`)}
function openSheet(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}function closeSheet(){document.getElementById('modal').classList.remove('open')}document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')closeSheet()};function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{current=b.dataset.page;render()});window.speechSynthesis&&document.addEventListener('click',e=>{if(e.target.dataset.speak){speechSynthesis.cancel();speechSynthesis.speak(new SpeechSynthesisUtterance(e.target.dataset.speak))}});if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});let deferred;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;const b=document.getElementById('installBtn');if(b)b.classList.add('visible')});document.addEventListener('click',e=>{if(e.target.id==='installBtn'&&deferred){deferred.prompt();deferred=null}});render();
</script></body></html>
